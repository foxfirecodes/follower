[package]
name = "rust-code-flow"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Prototype TypeScript/React callback flow explorer"
license = "MIT"

[lib]
name = "code_flow"
path = "src/lib.rs"

[[bin]]
name = "flow"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
oxc = { version = "=0.152.0", features = ["ast_visit", "cfg", "semantic"] }
oxc_resolver = "=11.24.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = "0.9.7"
walkdir = "2.5.0"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

